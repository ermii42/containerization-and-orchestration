{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orders.fullname" . }}-dashboard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  orders-sla.json: |-
{{ .Files.Get "files/orders-sla.json" | indent 4 }}
{{- end }}
