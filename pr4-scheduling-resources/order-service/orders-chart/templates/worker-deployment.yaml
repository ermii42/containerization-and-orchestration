apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
    app: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
      app.kubernetes.io/name: {{ index .Values.commonLabels "app.kubernetes.io/name" | quote }}
  template:
    metadata:
      labels:
        app: worker
        {{- toYaml .Values.commonLabels | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- if eq .Values.scheduling.strategy "topologySpread" }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.scheduling.maxSkew }}
          topologyKey: {{ .Values.scheduling.topologyKey }}
          whenUnsatisfiable: {{ .Values.scheduling.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: worker
              app.kubernetes.io/name: {{ index .Values.commonLabels "app.kubernetes.io/name" | quote }}
      {{- else if eq .Values.scheduling.strategy "podAntiAffinity" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: worker
                  app.kubernetes.io/name: {{ index .Values.commonLabels "app.kubernetes.io/name" | quote }}
              topologyKey: {{ .Values.scheduling.topologyKey }}
      {{- end }}
      containers:
        - name: worker
          image: {{ .Values.worker.image }}
          imagePullPolicy: {{ .Values.worker.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-postgres-app
                  key: uri
            - name: POLL_INTERVAL
              value: {{ .Values.worker.pollInterval | quote }}
            - name: MAX_ATTEMPTS
              value: {{ .Values.worker.maxAttempts | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.port }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3