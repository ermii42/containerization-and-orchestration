namespace: orders

commonLabels:
  app.kubernetes.io/name: orders
  app.kubernetes.io/part-of: orders
  app.kubernetes.io/managed-by: helm

# --- scheduling ---
# strategy: podAntiAffinity | topologySpread
scheduling:
  strategy: topologySpread
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# --- PriorityClass ---
priorityClasses:
  critical:
    name: orders-critical
    value: 1000000
    description: "Critical revenue-path services (api, postgres)"
  batch:
    name: orders-batch
    value: -100
    description: "Batch workloads, lower priority than services"

# --- Postgres (CNPG) ---
postgres:
  user: app
  password: app
  database: app
  host: orders-postgres-rw
  port: 5432
  instances: 1
  storage: 1Gi
  priorityClassName: orders-critical
  pdb:
    enabled: true
    minAvailable: 1
  # Guaranteed QoS: requests == limits для cpu и memory
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 100m        # = requests → Guaranteed
      memory: 256Mi    # = requests → Guaranteed

# --- api ---
api:
  image: ermii42/orders-api:monitoring
  pullPolicy: IfNotPresent
  replicas: 3
  healthFail: "false"
  port: 8000
  priorityClassName: orders-critical
  pdb:
    enabled: true
    minAvailable: 2
  # Guaranteed QoS: requests == limits для cpu и memory
  resources:
    requests:
      cpu: 57m
      memory: 100Mi
    limits:
      cpu: 57m         # = requests → Guaranteed
      memory: 100Mi    # = requests → Guaranteed

# --- worker ---
worker:
  image: ermii42/orders-worker:monitoring
  pullPolicy: IfNotPresent
  replicas: 2
  pollInterval: "1.0"
  maxAttempts: 5
  port: 8001
  # worker не входит в задание (нет PDB/priority), оставляем Burstable
  resources:
    requests:
      cpu: 13m
      memory: 100Mi
    limits:
      memory: 100Mi

# --- batch ---
batch:
  image: ermii42/batch-analytics:0.1.0
  pullPolicy: IfNotPresent
  replicas: 2
  port: 8002
  cpuThreads: 2
  memLimitMb: 1000
  memStepMb: 10
  memSleep: "1.0"
  priorityClassName: orders-batch
  pdb:
    enabled: false
  # Burstable QoS: requests заметно ниже limits
  resources:
    requests:
      cpu: 200m
      memory: 300Mi
    limits:
      cpu: 500m
      memory: 1280Mi

# --- monitoring ---
monitoring:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
