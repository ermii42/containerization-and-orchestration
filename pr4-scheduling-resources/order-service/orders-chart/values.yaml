namespace: orders

commonLabels:
  app.kubernetes.io/name: orders
  app.kubernetes.io/part-of: orders
  app.kubernetes.io/managed-by: helm

# --- scheduling ---
# strategy: podAntiAffinity | topologySpread
# - podAntiAffinity: строгое "не более одного пода на узел" (жёсткий лимит)
# - topologySpread: равномерное распределение с допустимым перекосом maxSkew
scheduling:
  strategy: topologySpread   # выбранный вариант
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway   # ScheduleAnyway (мягко) или DoNotSchedule (жёстко)

# --- Postgres (CNPG) ---
postgres:
  user: app
  password: app
  database: app
  host: orders-postgres-rw
  port: 5432
  instances: 1
  storage: 1Gi

# --- api ---
api:
  image: ermii42/orders-api:monitoring
  pullPolicy: IfNotPresent
  replicas: 3
  healthFail: "false"
  port: 8000
  resources:
    requests:
      cpu: 57m
      memory: 100Mi
    limits:
      memory: 100Mi

# --- worker ---
worker:
  image: ermii42/orders-worker:monitoring
  pullPolicy: IfNotPresent
  replicas: 2
  pollInterval: "1.0"
  maxAttempts: 5
  port: 8001
  resources:
    requests:
      cpu: 13m
      memory: 100Mi
    limits:
      memory: 100Mi

# --- batch ---
batch:
  image: ermii42/batch-analytics:0.1.0
  pullPolicy: IfNotPresent
  replicas: 1
  port: 8002
  cpuThreads: 2
  memLimitMb: 1024
  memStepMb: 50
  memSleep: "1.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

# --- monitoring ---
monitoring:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
