apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "batch-analytics.fullname" . }}
  labels:
    {{- include "batch-analytics.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "batch-analytics.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "batch-analytics.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: batch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CPU_THREADS
              value: {{ .Values.workload.cpuThreads | quote }}
            - name: MEM_STEP_MB
              value: {{ .Values.workload.memStepMb | quote }}
            - name: MEM_SLEEP
              value: {{ .Values.workload.memSleep | quote }}
            - name: MEM_LIMIT_MB
              value: {{ .Values.workload.memLimitMb | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}