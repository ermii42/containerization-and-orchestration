loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: 'filesystem'
  useTestSchema: true

deploymentMode: SingleBinary

singleBinary:
  replicas: 1

# Отключаем остальные режимы
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Отключаем кэши
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Отключаем minio (не нужен для filesystem)
minio:
  enabled: false

# Отключаем gateway
gateway:
  enabled: false