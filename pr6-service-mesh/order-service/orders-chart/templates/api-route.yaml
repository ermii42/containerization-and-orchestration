{{- if and .Values.mesh.enabled .Values.api.v2.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-split
  namespace: {{ .Values.namespace }}
  annotations:
    retry.linkerd.io/http: "500-504"
    retry.linkerd.io/limit: "3"
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: api
      port: 80
  rules:
    - backendRefs:
        - name: api-v1
          port: 80
          weight: {{ sub 100 (int .Values.api.v2.weight) }}
        - name: api-v2
          port: 80
          weight: {{ .Values.api.v2.weight }}
{{- end }}
