{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orders
  namespace: {{ .Values.namespace }}
  labels:
    release: {{ .Values.monitoring.releaseLabel }}
    {{- include "orders.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames: [{{ .Values.namespace }}]
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ index .Values.commonLabels "app.kubernetes.io/name" | quote }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.interval }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout }}
{{- end }}
