{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-default-deny
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-allow-client
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.networkPolicy.clientLabel | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.apiPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-allow-api
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.clientLabel | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.apiPort }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoringPodLabel | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.apiPort }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: orders-postgres
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgresPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-allow-worker
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoringPodLabel | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.workerPort }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: orders-postgres
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgresPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-allow-postgres
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: orders-postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        - podSelector:
            matchLabels:
              app: worker
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.postgresPort }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.cnpgOperatorNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.cnpgOperatorPodLabel | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.cnpgInstancePort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-allow-dns
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodLabel | nindent 14 }}
      ports:
        - protocol: UDP
          port: {{ .Values.networkPolicy.dnsPort }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.dnsPort }}
{{- end }}
