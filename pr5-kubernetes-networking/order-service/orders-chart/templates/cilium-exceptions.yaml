{{- if .Values.networkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: orders-api-nodeport
  namespace: {{ .Values.namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: api
  ingress:
    - fromEntities:
        - world
        - remote-node
        - host
      toPorts:
        - ports:
            - port: {{ .Values.networkPolicy.apiPort | quote }}
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: orders-postgres-kube-apiserver
  namespace: {{ .Values.namespace }}
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: orders-postgres
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: {{ .Values.networkPolicy.kubernetesAPI.port | quote }}
              protocol: TCP
{{- end }}
