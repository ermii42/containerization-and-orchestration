apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orders.labels" . | nindent 4 }}
    app: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
      app.kubernetes.io/name: {{ .Values.commonLabels.app\.kubernetes\.io/name | quote }}
  template:
    metadata:
      labels:
        app: worker
        {{- toYaml .Values.commonLabels | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: {{ .Values.worker.image }}
          imagePullPolicy: {{ .Values.worker.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}"
            - name: POLL_INTERVAL
              value: {{ .Values.worker.pollInterval | quote }}
            - name: MAX_ATTEMPTS
              value: {{ .Values.worker.maxAttempts | quote }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}